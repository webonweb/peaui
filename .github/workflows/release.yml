name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Build PeaUI library
        run: npm run library:build

      - name: Pack and test the exact release artifact
        run: npm run release:artifact

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE=$(find .release -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$ARCHIVE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading archive."

            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            echo "Creating release $TAG."

            gh release create "$TAG" "$ARCHIVE" \
              --verify-tag \
              --title "PeaUI ${TAG}" \
              --generate-notes
          fi
