stages:
  - validate
  - build
  - release
  - storybook

.test_template:
  image:
    name: node:24.11-alpine
    pull_policy: if-not-present
    entrypoint: [""]
  before_script:
    - apk add --no-cache libc6-compat
    - npm i
  tags:
    - docker-shared-1

lint:
  extends: [.test_template]
  stage: validate
  script:
    - npm run library:lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-chreb"
    - if: $CI_COMMIT_BRANCH == "develop-chreb"  && $CI_COMMIT_MESSAGE !~ /release:/ && $CI_COMMIT_MESSAGE !~ /skip ci/

# format:
#   extends: [.test_template]
#   stage: validate
#   script:
#     - npm run library:format
#   rules:
#     - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-chreb"
#     - if: $CI_COMMIT_BRANCH == "develop-chreb" && $CI_COMMIT_MESSAGE !~ /release:/ && $CI_COMMIT_MESSAGE !~ /skip ci/

test:
  extends: [.test_template]
  stage: validate
  script:
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-chreb"
    - if: $CI_COMMIT_BRANCH == "develop-chreb" && $CI_COMMIT_MESSAGE !~ /release:/ && $CI_COMMIT_MESSAGE !~ /skip ci/

changeset:
  extends: [.test_template]
  stage: validate
  script:
    - apk add --no-cache curl jq git
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      WATCH_DIR="packages/library"

      echo "🔎 Checking if there are changes in: $WATCH_DIR"
      if git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" | grep -qE "^${WATCH_DIR}"; then
        echo "✅ Changes detected in $WATCH_DIR — checking for changeset..."

        if git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" | grep -qE '^\.changeset\/.+\.md$'; then
          echo "✅ Changeset found"
        else
          echo "❌ Missing changeset (.changeset/*.md). Add one via: npx changeset"
          exit 1
        fi
      else
        echo "ℹ️ No changes in $WATCH_DIR — skipping changeset check."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-chreb"  && $CI_COMMIT_MESSAGE !~ /release:/ && $CI_COMMIT_MESSAGE !~ /skip ci/

build:
  extends: [.test_template]
  stage: build
  script:
    - npm run library:build
  artifacts:
    paths:
      - packages/library/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-chreb"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop-chreb"  && $CI_COMMIT_MESSAGE !~ /release:/ && $CI_COMMIT_MESSAGE !~ /skip ci/

release:
  extends: [.test_template]
  stage: release

  variables:
    GIT_DEPTH: "0"
    CI_COMMITTER_NAME: "GitLab Bot"
    CI_COMMITTER_EMAIL: "gitlab-bot@gunb.gov.pl"

  script:
    - apk add --no-cache curl jq git

    # Git configuration (required for commits/tags in CI)
    - export GITLAB_TOKEN=${GITLAB_TOKEN:-$CI_JOB_TOKEN}
    - export GL_TOKEN=${GITLAB_TOKEN}
    - git config --global user.email "${CI_COMMITTER_EMAIL}"
    - git config --global user.name "${CI_COMMITTER_NAME}"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git checkout -B "${CI_COMMIT_BRANCH}"

    # 1) Run versioning (bump version + generate changelog)
    - npx changeset version

    # 2) Extract version from packages/library/package.json
    - export VERSION="$(jq -r .version packages/library/package.json)"
    - export TAG="library-v${VERSION}"
    - |
      echo "Tag to create: ${TAG}"

    # 3) Build tag description from the changelog (section for this version)
    #    This parser assumes the standard Changesets format:
    #    ## X.Y.Z
    #    ... entries ...
    - CHANGELOG="packages/library/CHANGELOG.md"
    - |
      if [ ! -f "$CHANGELOG" ]; then
        echo "ERROR: $CHANGELOG not found"
        exit 1
      fi

    - |
      RELEASE_NOTES="$(awk -v ver="$VERSION" '
        BEGIN {found=0}
        $0 ~ "^##[[:space:]]+" ver "([[:space:]]|$)" {found=1; next}
        found && $0 ~ "^##[[:space:]]+" {exit}
        found {print}
      ' "$CHANGELOG" | sed -e 's/[[:space:]]*$//')"

      if [ -z "$RELEASE_NOTES" ]; then
        echo "ERROR: Could not extract release notes for version $VERSION from $CHANGELOG"
        echo "Tip: check if changelog uses '## $VERSION' headings."
        exit 1
      fi

      # write to file so git tag message handles multiline safely
      printf "%s\n" "library v${VERSION}" > /tmp/tagmsg.txt
      printf "%s\n" "$RELEASE_NOTES" >> /tmp/tagmsg.txt

    # 4) Update package-lock.json to reflect new versions (if you use npm lockfile)
    - npm install --package-lock-only

    # 5) Commit changes after running changeset version
    - export HUSKY=0
    - |
      git add -A

      if git diff --cached --quiet; then
        echo "No changes to commit (nothing versioned)."
        exit 0
      fi

      git commit -m "release: library v${VERSION}"

    # 6) Create an annotated tag with the release notes
    - |
      if git rev-parse "$TAG" >/dev/null 2>&1; then
        echo "ERROR: Tag $TAG already exists"
        exit 1
      fi

      git tag -a "$TAG" -F /tmp/tagmsg.txt

    # 7) Push the commit and the tag
    #    (Requires push permissions: PAT/Project Access Token or a properly configured CI_JOB_TOKEN)
    - git push origin "HEAD:${CI_COMMIT_BRANCH}"
    - git push origin "$TAG"

    # 8) Reelase package
    - |
      cat > .npmrc <<EOF
      @peaui:registry=https://gitlab.gunb.gov.pl/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
      //gitlab.gunb.gov.pl/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}
      EOF
    - npx changeset publish
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-chreb"  && $CI_COMMIT_MESSAGE !~ /release:/ && $CI_COMMIT_MESSAGE !~ /skip ci/

storybook-build:
  extends: [.test_template]
  stage: storybook

  variables:
    STORYBOOK_BASE: "/ui-components-1fb86d/"

  script:
    - npm run storybook:build
    - test -f packages/storybook/shell/storybook-static/index.html
  artifacts:
    paths:
      - packages/storybook/shell/storybook-static
      - packages/storybook/react/storybook-static
      - packages/storybook/vue/storybook-static
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-chreb"  && $CI_COMMIT_MESSAGE !~ /release:/ && $CI_COMMIT_MESSAGE !~ /skip ci/

pages:
  extends: [.test_template]
  stage: storybook
  needs: ["storybook-build"]
  script:
    - rm -rf public
    - mv packages/storybook/shell/storybook-static public
    - mkdir -p public/react
    - mv packages/storybook/react/storybook-static/* public/react
    - mkdir -p public/vue
    - mv packages/storybook/vue/storybook-static/* public/vue
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-chreb"  && $CI_COMMIT_MESSAGE !~ /release:/ && $CI_COMMIT_MESSAGE !~ /skip ci/
